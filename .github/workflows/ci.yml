name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  build:
    name: Build ESP-IDF
    runs-on: ubuntu-latest
    needs: pre-commit

    container:
      image: espressif/idf:release-v6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show ESP-IDF version
        run: idf.py --version

      - name: Set target
        run: idf.py set-target esp32

      - name: Build
        run: idf.py build
