name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  devcontainer:
    name: Devcontainer clean build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build devcontainer image
        run: docker build --tag vehicle-ecu-dev --file .devcontainer/Dockerfile .

      - name: Verify tools, formatting, and clean project build
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/project" \
            --workdir /project \
            vehicle-ecu-dev \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /project
              test "$(git -C /opt/esp/idf rev-parse HEAD)" = \
                "7101770dc6db2667b3c477cc31365dd1acd6db4e"
              python -m pip check
              pre-commit run --all-files

              build_project() {
                (
                  cd "$1"
                  idf.py set-target esp32
                  idf.py build
                )
              }

              build_project .
              build_project components/motor/test_apps/unit
              build_project components/drive/test_apps/unit
              build_project components/motor/test_apps/hardware

              git diff --exit-code -- \
                dependencies.lock \
                components/drive/test_apps/unit/dependencies.lock \
                components/motor/test_apps/hardware/dependencies.lock
            '
